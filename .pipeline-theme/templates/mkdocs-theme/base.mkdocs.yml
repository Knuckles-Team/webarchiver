# Shared GitHub Pages theme for the Knuckles-Team agent ecosystem.
#
# A consuming repository's own `mkdocs.yml` inherits this file via mkdocs's
# native `INHERIT:` key (a recursive dict merge, lists replaced only where the
# child repository re-declares them -- see `mkdocs.utils.yaml.yaml_load`).
# The `pages_pipeline.yml` reusable workflow wires the `INHERIT:` line in for
# every caller that sets `shared_theme_enabled: true`. The repository's own
# `mkdocs.yml` remains the content manifest; this file supplies the common
# presentation, while `scripts/sync_mkdocs_theme.py` materializes its generated
# assets into the caller's docs tree.

theme:
  name: material
  custom_dir: .pipeline-theme/templates/mkdocs-theme/overrides
  logo: assets/graph-mark.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra:
  spec_delivery: !ENV [SPEC_DELIVERY_ENABLED, false]
  architecture_explorer: !ENV [ARCHITECTURE_EXPLORER_ENABLED, false]
  # The explorer node each site opens at (deep link /architecture/#<node>).
  architecture_nodes:
    epistemic-graph: eg
    arbora: arbora
    scion-sdk: sdk
    agent-utilities: au
    agent-terminal-ui: tui
    agent-webui: webui
    pipelines: pipelines
    universal-skills: skills
  ecosystem:
    current: ""
    sites:
      - slug: agent-webui
        name: Agent Web UI
        role: operator experience
        url: https://knuckles-team.github.io/agent-webui/
        repository: https://github.com/Knuckles-Team/agent-webui
      - slug: arbora
        name: Arbora
        role: public runtime gateway
        url: https://knuckles-team.github.io/arbora/
        repository: https://github.com/Knuckles-Team/arbora
      - slug: agent-utilities
        name: Agent Utilities
        role: agent control plane
        url: https://knuckles-team.github.io/agent-utilities/
        repository: https://github.com/Knuckles-Team/agent-utilities
      - slug: epistemic-graph
        name: Epistemic Graph
        role: durable multimodal knowledge and reasoning engine
        url: https://knuckles-team.github.io/epistemic-graph/
        repository: https://github.com/Knuckles-Team/epistemic-graph
      - slug: scion-sdk
        name: Scion SDK
        role: governed source integration boundary
        url: https://knuckles-team.github.io/agent-connector-sdk/
        repository: https://github.com/Knuckles-Team/scion-sdk
      - slug: pipelines
        name: Skill Graph
        role: cross-repo concept, component and man-page corpus
        url: https://knuckles-team.github.io/pipelines/
        repository: https://github.com/Knuckles-Team/pipelines
        spec_delivery: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
